<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini POS - Duwi Putri Wahyuni</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>Mini POS</h1>
            <p>Kasir & Keranjang Belanja Sederhana</p>
            <p>Duwi Putri Wahyuni - 124140049</p>
        </header>

        <section class="form-section">

            <h2>Tambah Barang</h2>

            <div class="form-group">
                <label for="namaBarang">Nama Barang</label>
                <input type="text" id="namaBarang" placeholder="Masukkan nama barang">
                <small id="errorNama" class="error"></small>
            </div>

            <div class="form-group">
                <label for="hargaBarang">Harga</label>
                <input type="number" id="hargaBarang" placeholder="Masukkan harga">
                <small id="errorHarga" class="error"></small>
            </div>
            
            <div class="form-group">
                <label for="jumlahBarang">Jumlah</label>
                <input type="number" id="jumlahBarang" min="1" value="1">
                <small id="errorJumlah" class="error"></small>
            </div>
            

            <button onclick="tambahBarang()">Tambah ke Keranjang</button>

        </section>


        <section class="cart-section">

            <h2>Keranjang Belanja</h2>

            <table>
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama Barang</th>
                        <th>Harga</th>
                        <th>Jumlah</th>
                        <th>Subtotal</th>
                        <th>Aksi</th>
                    </tr>
                </thead>

                <tbody id="keranjang">
                </tbody>
            </table>

        </section>


        <section class="summary">

            <h2>Ringkasan Pembayaran</h2>

            <div class="summary-item">
                <span>Total Belanja</span>
                <span id="totalBelanja">Rp0</span>
            </div>

            <div class="summary-item">
                <span>Diskon</span>
                <span id="diskon">Rp0</span>
            </div>

            <div class="summary-item total">
                <span>Total Bayar</span>
                <span id="totalBayar">Rp0</span>
            </div>

            <div class="form-group">
                <label for="uangBayar">Uang Pembayaran</label>
                <input type="number" id="uangBayar" placeholder="Masukkan uang pembayaran">
            </div>

            <div class="summary-item">
                <span>Kembalian</span>
                <span id="kembalian">Rp0</span>
            </div>

            <button onclick="prosesPembayaran()">Proses Pembayaran</button>

            <button class="reset" onclick="transaksiBaru()">
                Transaksi Baru
            </button>

        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
